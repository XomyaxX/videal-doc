name: import-source
on:
  workflow_dispatch:
    inputs:
      url:
        description: Temporary tarball URL
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import snapshot
        env:
          SRC_URL: ${{ github.event.inputs.url }}
        run: |
          set -euo pipefail
          curl -L --fail -o /tmp/src.tgz "$SRC_URL"
          tar -xzf /tmp/src.tgz
          rm -f /tmp/src.tgz
          rm -f .github/workflows/import-source.yml
          git config user.name "XomyaxX"
          git config user.email "128803954+XomyaxX@users.noreply.github.com"
          git add -A
          git status --short | head -50
          git commit -m "Import Videal.Doc studio CRM/EDO source"
          git push
