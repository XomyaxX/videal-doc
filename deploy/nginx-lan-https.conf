# Optional LAN HTTPS so camera/mic work at https://192.168.1.51
# Cert: /etc/nginx/ssl/lan.crt + lan.key (self-signed). HTTP :80 stays for old phones.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name 192.168.1.51 videal-lan;
  ssl_certificate     /etc/nginx/ssl/lan.crt;
  ssl_certificate_key /etc/nginx/ssl/lan.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 512m;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
