server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  client_max_body_size 1024m;

  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.8.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  set $fwd_proto $scheme;
  if ($http_x_forwarded_proto = "https") { set $fwd_proto https; }
  if ($http_cf_visitor ~* "https") { set $fwd_proto https; }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  # Cloudflare tunnel backup only: apex → www.
  # Do NOT bounce LAN/Wi-Fi (no CF headers) onto https://www — phones then hang / ERR_FAILED.
  set $apex_https "";
  if ($http_cf_ray != "") { set $apex_https "1"; }
  if ($host != "videal-doc.ru") { set $apex_https ""; }
  if ($apex_https = "1") {
    return 301 https://www.videal-doc.ru$request_uri;
  }

  location = /tv { return 301 /tv/; }
  location /tv/ {
    alias /var/www/tv/;
  }

  location /api/data/related-zip {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_body_timeout 600s;
  }
}
